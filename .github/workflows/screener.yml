name: NSE Screener v5

on:
  schedule:
    - cron: '0 * * * *'   # Every 1 hour (GitHub uses UTC)
  workflow_dispatch:        # Manual trigger button on GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55     # Kill if stuck before next run

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NSE Screener
        run: python nse_screener_v5.py
        env:
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_APP_PASSWORD:  ${{ secrets.EMAIL_APP_PASSWORD }}
